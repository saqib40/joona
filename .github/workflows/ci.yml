name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w apps/desktop
      - run: npm run test -w apps/desktop
      - run: npx vite build
        working-directory: apps/desktop

  rust:
    name: Rust (engine, app, tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: Build engine sidecar
        shell: pwsh
        run: ./scripts/build-engine.ps1
      - name: Build frontend (embedded into the app)
        run: npx vite build
        working-directory: apps/desktop
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Third-party licences
        run: node scripts/notices.mjs
