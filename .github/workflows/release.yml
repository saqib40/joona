name: Release

# Builds the Windows and macOS installers and their update signatures, and drafts
# a GitHub release with them and latest.json. Publishing the draft is what makes
# installed copies offer the update. See docs/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  VULKAN_VERSION: 1.4.313.2

jobs:
  prepare:
    name: Prepare release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      notes: ${{ steps.release.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
      - name: Check version and read release notes
        id: release
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          crates=$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f2)
          if [ "$crates" != "$version" ]; then
            echo "apps/desktop/package.json says $version but Cargo.toml says $crates."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match version $version."
            exit 1
          fi
          notes=$(node -e "
            const fs = require('fs');
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const match = changelog.match(/^## ${version}\s*\n([\s\S]*?)(?=^## |\$)/m);
            if (!match) {
              console.error('CHANGELOG.md has no section for ${version}.');
              process.exit(1);
            }
            process.stdout.write(match[1].trim());
          ")
          echo "version=$version" >> $GITHUB_OUTPUT
          delimiter="NOTES_$(date +%s%N)"
          echo "notes<<$delimiter" >> $GITHUB_OUTPUT
          echo "$notes" >> $GITHUB_OUTPUT
          echo "$delimiter" >> $GITHUB_OUTPUT

  windows:
    name: Windows installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      AZURE_SIGNING: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
          # whisper.cpp's cached CMake build records the compiler's path, which
          # changes when GitHub updates the runner image.
          env-vars: ImageVersion
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Install trusted-signing-cli
        if: env.AZURE_SIGNING == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: trusted-signing-cli
      - run: npm ci

      # The GPU engine compiles whisper.cpp's Vulkan shaders, which needs the SDK.
      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vulkan-sdk.exe"
          curl.exe --fail --location --silent --show-error --output $installer `
            "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          $setup = Start-Process $installer -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "The Vulkan SDK installer failed with exit code $($setup.ExitCode)." }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"

      - name: Build the engines
        shell: pwsh
        run: |
          ./scripts/build-engine.ps1 -Release
          ./scripts/build-engine.ps1 -Variant vulkan -Release

      - name: Collect third-party licences
        run: node scripts/notices.mjs

      - name: Build and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          AZURE_TRUSTED_SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: --config src-tauri/tauri.release.conf.json
          tagName: v__VERSION__
          releaseName: Joona __VERSION__
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: true
          includeUpdaterJson: true

  macos:
    name: macOS installer
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_CONTENT != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-macos
          env-vars: ImageVersion
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: npm ci

      - name: Build the Metal engine
        run: node scripts/build-engine.mjs --release

      - name: Collect third-party licences
        run: node scripts/notices.mjs

      - name: Setup App Store Connect Private Key
        if: env.HAS_APPLE_API_KEY == 'true'
        run: |
          mkdir -p "${{ github.workspace }}/private_keys"
          echo "${{ secrets.APPLE_API_KEY_CONTENT }}" > "${{ github.workspace }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"
          chmod 600 "${{ github.workspace }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8"

      - name: Build and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ github.workspace }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          args: --config src-tauri/tauri.macos.conf.json
          tagName: v__VERSION__
          releaseName: Joona __VERSION__
          releaseBody: ${{ needs.prepare.outputs.notes }}
          releaseDraft: true
          includeUpdaterJson: true
